# Builds the service image and publishes it to GitHub's registry.
#
# Runs in your repository with the token GitHub issues to the job, so no
# registry credential has to be stored anywhere. The image carries code only --
# no .env, no knowledge base, no API key -- which is what makes it safe to make
# public.
#
# arm64 is not optional: Oracle Cloud's free tier is Ampere, and an amd64-only
# image fails on it with an exec format error that reads like a broken image
# rather than a wrong architecture.

name: Publish service image

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/publish-image.yml"
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/ditto-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU lets one amd64 runner build the arm64 half.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
